<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar a modo claro">🌙</button>
    <h1 class="game-title">TETRIS GAME</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section highscores-section">
          <span class="label">RÉCORDS</span>
          <ol id="highscores-list" class="highscores-list"></ol>
          <div class="highscores-stats">
            <span>Mejor combo: <strong id="best-combo">0</strong></span>
            <span>Mejor líneas: <strong id="best-lines">0</strong></span>
          </div>
          <button id="reset-highscores-btn" class="reset-btn" type="button">Reiniciar récords</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="highscore-form" class="highscore-form hidden">
          <label for="player-name-input">¡Nuevo récord! Introduce tu nombre:</label>
          <input id="player-name-input" type="text" maxlength="12" placeholder="Nombre" autocomplete="off" />
          <button id="save-score-btn" type="button">Guardar</button>
        </div>

        <div class="panel-section highscores-section overlay-highscores">
          <span class="label">RÉCORDS</span>
          <ol id="overlay-highscores-list" class="highscores-list"></ol>
          <div class="highscores-stats">
            <span>Mejor combo: <strong id="overlay-best-combo">0</strong></span>
            <span>Mejor líneas: <strong id="overlay-best-lines">0</strong></span>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
